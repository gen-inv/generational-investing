name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly check of the live site, 09:17 UTC (about 03:17 in Edmonton).
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    # Tests and build on every push and pull request. Needs no secrets and never deploys.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:routes
      - run: npm run build

  smoke:
    # Nightly (or on demand) check that the live site is up and its locked-down routes are still locked.
    # Without the SMOKE_EMAIL / SMOKE_PASSWORD secrets it runs the public checks only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_URL: https://app.generationalinvesting.ca
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run smoke
